name: ProjectFlow AI CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-mcp.txt
      - name: Check syntax
        run: python -m compileall -q app.py farol.py atas_github.py resource_capacity.py mcp_projectflow tests
      - name: Run tests
        run: python -m pytest -q
